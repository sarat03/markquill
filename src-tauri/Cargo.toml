[package]
name = "markquill"
version = "0.1.2" # the app version; to release, see the top of .github/workflows/tauri.yml
edition = "2021"
description = "Small, fast Markdown viewer and editor"
license = "GPL-3.0-only"
repository = "https://github.com/sarat03/markquill"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"
base64 = "0.22"

# smaller download for users (Tauri's size guide). panic stays "unwind": a failed command mustn't kill a window with unsaved edits.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
