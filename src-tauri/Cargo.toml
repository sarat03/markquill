[package]
name = "markquill"
version = "0.1.5" # the app version; to release, see the top of .github/workflows/tauri.yml
edition = "2021"
description = "Small, fast Markdown viewer and editor"
license = "GPL-3.0-only"
repository = "https://github.com/sarat03/markquill"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = "1"
base64 = "0.22"

# Writing PDFs straight from the webview. All of these are already in the tree through wry, so they add no download size.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
gtk = "0.18"

# smaller download for users (Tauri's size guide). panic stays "unwind": a failed command mustn't kill a window with unsaved edits.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
