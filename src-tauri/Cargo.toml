[package]
name = "markquill"
version = "0.1.4" # the app version; to release, see the top of .github/workflows/tauri.yml
edition = "2021"
description = "Small, fast Markdown viewer and editor"
license = "GPL-3.0-only"
repository = "https://github.com/sarat03/markquill"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# already in the tree via wry; used to set the print dialog's paper size
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

# smaller download for users (Tauri's size guide). panic stays "unwind": a failed command mustn't kill a window with unsaved edits.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
