[package]
name = "markquill"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
base64 = "0.22"

# smaller download for users (Tauri's size guide). panic stays "unwind": a failed command mustn't kill a window with unsaved edits.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
