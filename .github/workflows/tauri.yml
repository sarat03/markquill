# Builds MarkQuill, runs the unit tests and launches the build once.
# Pull requests and main build Linux only (macOS runners cost 10x the Actions minutes, Windows 2x); tags and
# manual runs (Actions > Tauri > Run workflow) build every OS. Every pull request runs it: main requires the Linux build.
#
# Releasing (maintainer only):
#   1. Set the version in src-tauri/Cargo.toml. It's the only place it lives; installers are named after it.
#   2. Merge that to main. Optionally run this workflow on main by hand first to build every OS. Then tag it:  git tag v0.2.0 && git push origin v0.2.0
#   3. The tag run checks it matches the version, creates one draft release (notes from
#      .github/release-notes.md plus merged PRs) and attaches every installer. Check the draft, then publish.
name: Tauri

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # draft releases on tags

jobs:
  # One job creates the draft before any build uploads to it, so parallel builds can't race into two drafts.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/Cargo.toml"; exit 1; }
      # a release that already exists (a re-run, or a tag moved to a fix) just gets its installers replaced below
      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "MarkQuill ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --generate-notes

  build:
    needs: release
    # branches and pull requests skip the release job; build anyway, but never after it failed
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
          && '["mac-arm", "mac-intel", "windows", "linux"]' || '["linux"]') }}
    # Per platform: runner, Rust target and installers. Lookups rather than matrix `include`, which would add the
    # Mac and Windows jobs back on pull requests. Linux builds on the oldest supported Ubuntu so the packages
    # install on more distros, and ships .deb/.rpm only: an AppImage bundles its own WebKitGTK (~80 MB).
    runs-on: ${{ fromJSON('{"mac-arm":"macos-latest","mac-intel":"macos-latest","windows":"windows-latest","linux":"ubuntu-22.04"}')[matrix.platform] }}
    env:
      TARGET: ${{ fromJSON('{"mac-arm":"aarch64-apple-darwin","mac-intel":"x86_64-apple-darwin","windows":"x86_64-pc-windows-msvc","linux":"x86_64-unknown-linux-gnu"}')[matrix.platform] }}
      BUNDLES: ${{ fromJSON('{"mac-arm":"app,dmg","mac-intel":"app,dmg","windows":"nsis,msi","linux":"deb,rpm"}')[matrix.platform] }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.TARGET }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: |
          npm ci
          npx tauri build --target ${{ env.TARGET }} --bundles ${{ env.BUNDLES }}

      # The webview must come up and stay up with a document open. Catches missing runtime libs,
      # a broken bundle or a crash on start; says nothing about how the page looks.
      - name: Launch check
        # an Intel build can't start on the Apple silicon runner without Rosetta
        if: matrix.platform != 'mac-intel'
        run: |
          bin=src-tauri/target/${{ env.TARGET }}/release/markquill
          [ "$RUNNER_OS" = Windows ] && bin=$bin.exe
          wrap=; [ "$RUNNER_OS" = Linux ] && wrap="xvfb-run -a"
          printf '# Launch check\n\n$E=mc^2$\n\n```mermaid\ngraph LR\n  A --> B\n```\n' > launch-check.md
          $wrap "$bin" launch-check.md & pid=$!
          sleep 20
          kill -0 $pid || { echo "MarkQuill exited during startup"; exit 1; }
          kill $pid || true

      - name: Collect installers
        run: |
          shopt -s nullglob
          mkdir installers
          cp src-tauri/target/${{ env.TARGET }}/release/bundle/{dmg/*.dmg,nsis/*.exe,msi/*.msi,deb/*.deb,rpm/*.rpm} installers/
          ls -l installers
          [ -n "$(ls installers)" ] || { echo "No installers were built"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: MarkQuill-${{ env.TARGET }}
          path: installers/*

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" installers/* --clobber
