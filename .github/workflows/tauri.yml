# Builds MarkQuill, runs the unit tests and launches the build once.
# Pull requests and main build Linux only (macOS runners cost 10x the Actions minutes, Windows 2x); tags and
# manual runs (Actions > Tauri > Run workflow) build every OS. Every pull request runs it: main requires the Linux build.
#
# Releasing (maintainer only):
#   1. Set the version in src-tauri/Cargo.toml (installers are named after it) and in Casks/markquill.rb (Homebrew).
#   2. Merge that to main. Optionally run this workflow on main by hand first to build every OS. Then tag it:  git tag v0.2.0 && git push origin v0.2.0
#   3. The tag run checks it matches the version, creates one draft release (notes from
#      .github/release-notes.md plus merged PRs) and attaches every installer. Check the draft, then publish.
#   4. winget (package id Sarat.MarkQuill, first submitted with 0.1.3), from any OS with komac (brew install komac):
#      GITHUB_TOKEN=$(gh auth token) komac update Sarat.MarkQuill -v 0.2.0 -u <win-x64-setup.exe url> <win-arm-setup.exe url> --submit
#      Check the ARM installer is listed as arm64 in the PR (komac has guessed arm).
name: Tauri

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # draft releases on tags

jobs:
  # One job creates the draft before any build uploads to it, so parallel builds can't race into two drafts.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/Cargo.toml"; exit 1; }
          grep -q "version \"$version\"" Casks/markquill.rb || { echo "Set version \"$version\" in Casks/markquill.rb too"; exit 1; }
      # a release that already exists (a re-run, or a tag moved to a fix) just gets its installers replaced below
      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "MarkQuill ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --generate-notes

  build:
    needs: release
    # branches and pull requests skip the release job; build anyway, but never after it failed
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
          && '["mac-m-arm", "mac-intel-x64", "win-x64", "win-arm", "linux"]' || '["linux"]') }}
    # Installer names, for every release: MarkQuill_<version>_<label>.<ext>, labels
    #   mac-m-arm, mac-intel-x64 (.dmg) · win-x64, win-arm (-setup.exe, .msi) · linux-amd64 (.deb), linux-x86_64 (.rpm)
    # The platform name is the label, except Linux, whose label is the package's arch.
    # Per platform: runner, Rust target and installers. Lookups rather than matrix `include`, which would add the
    # Mac and Windows jobs back on pull requests. Linux builds on the oldest supported Ubuntu so the packages
    # install on more distros, and ships .deb/.rpm only: an AppImage bundles its own WebKitGTK (~80 MB).
    # Windows ARM cross-builds on the x64 runner, NSIS only: Tauri's MSI can't target ARM.
    runs-on: ${{ fromJSON('{"mac-m-arm":"macos-latest","mac-intel-x64":"macos-latest","win-x64":"windows-latest","win-arm":"windows-latest","linux":"ubuntu-22.04"}')[matrix.platform] }}
    env:
      TARGET: ${{ fromJSON('{"mac-m-arm":"aarch64-apple-darwin","mac-intel-x64":"x86_64-apple-darwin","win-x64":"x86_64-pc-windows-msvc","win-arm":"aarch64-pc-windows-msvc","linux":"x86_64-unknown-linux-gnu"}')[matrix.platform] }}
      BUNDLES: ${{ fromJSON('{"mac-m-arm":"app,dmg","mac-intel-x64":"app,dmg","win-x64":"nsis,msi","win-arm":"nsis","linux":"deb,rpm"}')[matrix.platform] }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.TARGET }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # With the signing key (release builds only), also makes the signed in-app update files for macOS and Windows.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          sign=; [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ "$RUNNER_OS" != Linux ] && sign='--config {"bundle":{"createUpdaterArtifacts":true}}'
          npx tauri build --target ${{ env.TARGET }} --bundles ${{ env.BUNDLES }} $sign

      # The webview must come up and stay up with a document open. Catches missing runtime libs,
      # a broken bundle or a crash on start; says nothing about how the page looks.
      - name: Launch check
        # an Intel build can't start on the Apple silicon runner without Rosetta, nor an ARM one on the x64 Windows runner
        if: matrix.platform != 'mac-intel-x64' && matrix.platform != 'win-arm'
        run: |
          bin=src-tauri/target/${{ env.TARGET }}/release/markquill
          [ "$RUNNER_OS" = Windows ] && bin=$bin.exe
          wrap=; [ "$RUNNER_OS" = Linux ] && wrap="xvfb-run -a"
          printf '# Launch check\n\n$E=mc^2$\n\n```mermaid\ngraph LR\n  A --> B\n```\n' > launch-check.md
          $wrap "$bin" launch-check.md & pid=$!
          sleep 20
          kill -0 $pid || { echo "MarkQuill exited during startup"; exit 1; }
          kill $pid || true

      - name: Collect installers
        run: |
          shopt -s nullglob
          mkdir installers
          b=src-tauri/target/${{ env.TARGET }}/release/bundle
          name=MarkQuill_$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2)_${{ matrix.platform }}
          for f in $b/deb/*.deb; do cp "$f" installers/${name%_linux}_linux-amd64.deb; done
          for f in $b/rpm/*.rpm; do cp "$f" installers/${name%_linux}_linux-x86_64.rpm; done
          for f in $b/dmg/*.dmg; do cp "$f" installers/$name.dmg; done
          for f in $b/nsis/*.exe; do cp "$f" installers/$name-setup.exe; done
          # in-app update files: macOS installs the .app.tar.gz, Windows runs the NSIS setup; each with its .sig
          for f in $b/macos/*.app.tar.gz; do cp "$f" installers/$name.app.tar.gz; cp "$f.sig" installers/$name.app.tar.gz.sig; done
          for f in $b/nsis/*.exe.sig; do cp "$f" installers/$name-setup.exe.sig; done
          for f in $b/msi/*.msi; do cp "$f" installers/$name.msi; done
          ls -l installers
          [ -n "$(ls installers)" ] || { echo "No installers were built"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: MarkQuill-${{ env.TARGET }}
          path: installers/*

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" installers/* --clobber

  # latest.json tells installed apps (Settings > Install updates) where each platform's signed update is.
  updater-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Write latest.json
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*.sig' -D sigs || exit 0 # no signing key: no in-app updates
          v=${GITHUB_REF_NAME#v}; url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          entry() { [ -f "sigs/$2.sig" ] && jq -n --arg k "$1" --arg s "$(cat "sigs/$2.sig")" --arg u "$url/$2" '{($k): {signature: $s, url: $u}}' || echo '{}'; }
          { entry darwin-aarch64 MarkQuill_${v}_mac-m-arm.app.tar.gz
            entry darwin-x86_64 MarkQuill_${v}_mac-intel-x64.app.tar.gz
            entry windows-x86_64 MarkQuill_${v}_win-x64-setup.exe
            entry windows-aarch64 MarkQuill_${v}_win-arm-setup.exe
          } | jq -s --arg v "$v" '{version: $v, pub_date: (now | todate), platforms: add}' > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" latest.json --clobber
