<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarkQuill</title>
<link rel="stylesheet" href="vditor/dist/index.css">
<script src="vditor/dist/index.min.js"></script>
<style>
/* ---- design tokens: chrome (panel) sits a step away from the document (bg), like a macOS sidebar ---- */
:root{--bg:#fff;--fg:#1f2328;--mute:#6b7079;--line:#e3e4e8;--panel:#f7f7f8;--hover:#ebebee;--raised:#fff;--accent:#0969da;--accent-soft:#0969da1f;
  --shadow:0 10px 30px #0000001f,0 0 0 1px #0000000d;--ui:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --font:-apple-system,system-ui,sans-serif;--size:16px;--width:760px;--lh:1.6;--code-font:ui-monospace,Menlo,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;--code-size:14px;--tab:4;
  --gutter:clamp(16px,5vw,40px);accent-color:var(--accent)}
:root[data-theme=dark]{--bg:#1d2125;--fg:#d1d5da;--mute:#8b949e;--line:#30363d;--panel:#171a1d;--hover:#2a2f35;--raised:#353b43;--accent:#4493f8;--accent-soft:#4493f833;--shadow:0 10px 30px #00000073,0 0 0 1px #ffffff14}
*{box-sizing:border-box}
[data-os=win] *{scrollbar-width:thin} /* Windows draws wide classic scrollbars by default */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[contenteditable]:focus-visible{outline:0} /* the writing surface itself */

/* ---- controls ---- */
button,select,input[type=text],textarea{font:inherit;color:var(--fg)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--raised);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
button:hover{background:var(--hover)}
button.on,button.on:hover{background:var(--accent);border-color:var(--accent);color:#fff}
button.icon{width:30px;height:30px;padding:0;border:0;background:none;color:var(--mute);position:relative}
button.icon:hover,button.icon[aria-expanded=true]{background:var(--hover);color:var(--fg)}
select,input[type=text],textarea{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
select{height:28px;cursor:pointer}
textarea{resize:vertical;font:12px/1.5 var(--code-font)}
input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
kbd{font:inherit;font-size:11px;opacity:.7}
/* segmented control (mode switch, font, paper) */
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--hover)}
.seg>button,.seg>label>span{height:26px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.seg>button:hover,.seg>label>span:hover{background:none;color:var(--fg)}
.seg>button.on,.seg>label>input:checked+span{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px #0000001f,0 0 0 .5px #0000000f}
.seg>label>input:focus-visible+span{outline:2px solid var(--accent)}
.seg.full{display:flex}.seg.full>label{flex:1}.seg.full>label>span{width:100%}
/* toggle switch */
.switch{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:18px;margin:0;border-radius:9px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0000004d;transition:transform .15s}
.switch:checked{background:var(--accent)}.switch:checked::after{transform:translateX(12px)}
/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:4px 0 0;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:.5px solid #0000002e;box-shadow:0 1px 3px #0000004d}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:.5px solid #0000002e;box-shadow:0 1px 3px #0000004d}

/* ---- app layout: [files sidebar] [bar / document / status] [settings panel] ---- */
.app{display:flex;height:100%;position:relative}
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
.side{flex:none;width:250px;display:none;flex-direction:column;background:var(--panel)}
#side{border-right:1px solid var(--line)}#settings{width:290px;border-left:1px solid var(--line)}
body.tree #side,#settings.open{display:flex}
.side-head{flex:none;height:41px;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;border-bottom:1px solid var(--line)}
/* the sidebar toggle stays pinned top-left whether the sidebar is open or not */
#tTree{position:absolute;top:6px;left:8px;z-index:110}
#side .side-head{padding-left:46px}
.side-head h2{flex:1;margin:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bar: tabs + actions in one row */
#bar{flex:none;height:41px;display:flex;align-items:flex-end;gap:4px;padding:0 8px 0 46px;background:var(--panel);box-shadow:inset 0 -1px 0 var(--line)}
#bar>.icon,.actions{align-self:center}
.actions{display:flex;align-items:center;gap:2px;flex:none}
.actions .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
#save.dirty::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}

/* tabs: the active tab joins the page below it */
#tabs{flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none;padding-left:4px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 1 190px;min-width:96px;height:32px;margin-bottom:4px;display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;border-radius:7px;color:var(--mute);cursor:default;user-select:none;-webkit-user-select:none;position:relative}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.cur{height:36px;margin-bottom:0;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg);color:var(--fg);font-weight:500}
.tab.over::before{content:"";position:absolute;left:-2px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--accent)}
.tab .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:20px;height:20px;padding:0;border:0;border-radius:4px;background:none;color:var(--mute);visibility:hidden}
.tab .x svg{width:13px;height:13px}
.tab .x:hover{background:var(--line);color:var(--fg)}
.tab:hover .x,.tab.cur .x,.tab.dirty .x{visibility:visible}
.tab.dirty:not(:hover) .x svg{display:none}
.tab.dirty:not(:hover) .x::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.tab input{font:inherit;width:100%;height:22px;padding:0 4px}
#newTab{flex:none;width:28px;height:28px;margin-bottom:6px}

/* document */
.body{flex:1;min-height:0;display:flex}
main{flex:1;min-width:0;position:relative}
#out{position:absolute;inset:0;overflow:auto;padding:48px var(--gutter) 30vh}
#editor{height:100%}
body.read #editor,body.edit #out,body.source #out{display:none}
#doc,.vditor-reset{font-family:var(--font)!important;font-size:var(--size)!important;line-height:var(--lh)!important;color:var(--fg)}
#doc code,#doc pre,.vditor-reset code,.vditor-reset pre,.vditor-sv{font-family:var(--code-font)!important;tab-size:var(--tab)}
/* code colors (Settings › Code): the text and background of code blocks and inline code */
.vditor-reset pre>code,.vditor-reset pre>code.hljs{background:var(--code-bg)!important;color:var(--code-fg)!important}
.vditor-reset :not(pre)>code{background:var(--icode-bg)!important;color:var(--icode-fg)!important}
/* the three code styles, each with a light and a dark variant: block bg / text, inline bg / text */
:root{--code-bg:#f6f8fa;--code-fg:#1f2328;--icode-bg:#818b981f;--icode-fg:#1f2328}
:root[data-theme=dark]{--code-bg:#161b22;--code-fg:#e6edf3;--icode-bg:#656c7633;--icode-fg:#e6edf3}
:root[data-code=vscode]{--code-bg:#1e1e1e;--code-fg:#d4d4d4;--icode-bg:#1e1e1e;--icode-fg:#d4d4d4}
:root[data-code=red]{--code-bg:#f7f6f3;--code-fg:#37352f;--icode-bg:#87837826;--icode-fg:#eb5757}
:root[data-code=red][data-theme=dark]{--code-bg:#252525;--code-fg:#e6e6e6;--icode-bg:#87837826;--icode-fg:#ff7369}
#doc pre code,.vditor-reset pre code,.vditor-sv{font-size:var(--code-size)!important}
/* tables fit the column and wrap their cells instead of scrolling sideways, on screen and on paper (!important: Vditor's theme loads later).
   break-word, not anywhere: anywhere lets a narrow column shrink to one letter per line */
.vditor-reset table{display:table!important;overflow:visible!important;width:auto!important;max-width:100%}
.vditor-reset td,.vditor-reset th,.vditor-reset td code,.vditor-reset th code{white-space:normal!important;word-break:normal!important;overflow-wrap:break-word!important}
#doc{max-width:var(--width);margin:0 auto;padding:0}
/* empty document */
#empty{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:60%;text-align:center;color:var(--mute);font-size:14px}
#empty>svg{width:44px;height:44px;stroke-width:1.2;margin-bottom:8px;opacity:.7}
#empty h2{margin:0;font-size:18px;font-weight:600;color:var(--fg)}#empty p{margin:0 0 14px}
#empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
body.empty #empty{display:flex}body.empty #doc{display:none}

/* editor (Vditor), themed through its own variables so it reads as part of the page.
   Edit and Source use the same centered column as View, so switching modes doesn't move the text. */
.vditor{--border-color:var(--line);--second-color:var(--line);--panel-background-color:var(--bg);--panel-shadow:var(--shadow);--toolbar-background-color:var(--bg);--toolbar-icon-color:var(--mute);--toolbar-icon-hover-color:var(--fg);--textarea-background-color:var(--bg);--textarea-text-color:var(--fg);--toolbar-height:30px;--toolbar-divider-margin-top:7px;border:0!important;border-radius:0!important;background:var(--bg)}
.vditor-toolbar{display:flex;flex-wrap:wrap;justify-content:center;padding:5px 12px!important;border-bottom:1px solid var(--line)!important}
.vditor-toolbar__item .vditor-tooltipped{width:28px;padding:0;border-radius:6px;display:flex;align-items:center;justify-content:center}
.vditor-toolbar__item .vditor-tooltipped:hover{background:var(--hover)}
.vditor-toolbar__divider{margin:7px 6px!important}
.vditor-toolbar svg.i{fill:none}
/* writing-mode dropdown in the formatting row: current mode's name + chevron */
.vditor-toolbar__item .vditor-tooltipped[data-type=insert]{width:auto;gap:2px;padding:0 6px}
.vditor-toolbar [data-type=insert] svg:last-child{width:12px;height:12px;color:var(--mute)}
.vditor-toolbar [data-type=insert]::before,.vditor-toolbar [data-type=insert]::after{display:none}
.menu{user-select:none;-webkit-user-select:none}
#editor{container-type:inline-size}
@container (max-width:780px){.vditor-toolbar [data-type=wm] span{display:none}} /* narrow editor: the mode's icon + chevron */
.vditor-toolbar__item .vditor-tooltipped[data-type=wm]{width:auto;gap:6px;padding:0 8px;color:var(--fg)}
.vditor-toolbar [data-type=wm] span{font-size:12px;white-space:nowrap}
.vditor-toolbar [data-type=wm]::before,.vditor-toolbar [data-type=wm]::after{display:none} /* its label says it; no tooltip over it */
.vditor-toolbar [data-type=wm] svg:last-child{width:12px;height:12px;color:var(--mute)}
.vditor-sv:focus{box-shadow:none!important} /* the writing surface, not a form field */
/* the scroller spans the full width (scrollbar at the window edge); padding centres the text column */
.vditor-ir .vditor-reset,.vditor-wysiwyg .vditor-reset{max-width:none;margin:0!important;padding:40px max(var(--gutter), calc((100% - var(--width)) / 2)) 30vh!important}
.vditor-sv{max-width:none;margin:0!important;padding:48px max(var(--gutter), calc((100% - var(--width)) / 2)) 30vh!important;color:var(--fg)!important;background:var(--bg)!important}
/* Settings › Alignment: Left fills the whole window (Page width only applies when centred) */
body.left #doc{margin:0;max-width:none}
body.left .vditor-ir .vditor-reset,body.left .vditor-wysiwyg .vditor-reset,body.left .vditor-sv{padding-left:var(--gutter)!important;padding-right:var(--gutter)!important}
.vditor-outline{background:var(--panel)!important}
/* focus mode: dim every block except the one holding the caret */
body.focus .vditor-reset>*{opacity:.25;transition:opacity .15s}
body.focus .vditor-reset>.md-active{opacity:1}

/* block button: badge in the left margin of the caret's block; click for actions, drag to move */
[hidden]{display:none!important}
#blockBtn svg{width:15px;height:15px}
#blockBtn{position:fixed;z-index:40;width:26px;height:22px;padding:0;border:0;border-radius:5px;background:none;color:var(--mute);font:600 11px var(--ui);cursor:grab}
#blockBtn:hover,#blockBtn[aria-expanded=true]{background:var(--hover);color:var(--fg)}
#dropLine{position:fixed;z-index:40;height:2px;border-radius:1px;background:var(--accent);pointer-events:none}
.vditor-reset>.dragging{opacity:.35}
.vditor-ir>.vditor-reset>:is(h1,h2,h3,h4,h5,h6)::before{display:none} /* Vditor's own H1–H6 labels; the block button replaces them */

/* find bar (floats over the top right of the document) */
#find{display:none;position:absolute;top:10px;right:18px;z-index:50;width:min(380px,calc(100% - 24px));padding:8px;border-radius:10px;background:var(--raised);box-shadow:var(--shadow);flex-direction:column;gap:6px}
#find.open{display:flex}
body:not(.read) #find{top:52px} /* below the formatting toolbar */
#find .frow{display:flex;align-items:center;gap:4px}
#find input[type=text]{flex:1;min-width:0;height:28px}
#fcount{flex:none;min-width:0;max-width:110px;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#fcount:empty{display:none}
.tog{flex:none;height:28px;min-width:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--mute);font:600 12px var(--code-font);cursor:pointer}
.tog:hover{background:var(--hover);color:var(--fg)}
.tog:has(:checked){background:var(--accent-soft);color:var(--accent)}
.tog:has(:focus-visible){outline:2px solid var(--accent)}
#find .icon{width:28px;height:28px}
#fall{flex:none}

/* files sidebar */
#tree{flex:1;overflow:auto;padding:6px}
#tree a{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;color:var(--fg);white-space:nowrap;cursor:pointer}
#tree a span{flex:1;overflow:hidden;text-overflow:ellipsis}
#tree a svg{color:var(--mute)}
#tree a:hover{background:var(--hover)}
#tree a.cur{background:var(--accent-soft);color:var(--accent)}#tree a.cur svg{color:var(--accent)}
#tree a.dirty::after{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--mute)}

/* settings panel */
#settings .scroll{flex:1;overflow:auto;padding:4px 16px 24px}
#gear{position:relative}#gear.dot::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
#settings h3{margin:20px 0 10px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.field{display:block;margin-bottom:14px}
.fl{display:flex;justify-content:space-between;margin-bottom:6px}
.fl output{color:var(--mute);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer}
.toggle>span{flex:1}.toggle small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-bottom:16px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mute);cursor:pointer}
.sw:has(:checked){color:var(--fg);font-weight:500}
.thumb{display:block;width:100%;height:46px;border-radius:7px;background:var(--t-bg);box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden}
.thumb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:28%;background:var(--t-panel)}
.thumb::after{content:"";position:absolute;left:38%;right:14%;top:12px;height:4px;border-radius:2px;background:var(--t-fg);box-shadow:0 9px 0 var(--t-mute),0 18px 0 var(--t-accent)}
.thumb.sys{background:linear-gradient(135deg,#fff 50%,#1d2125 50%)}.thumb.sys::before,.thumb.sys::after{display:none}
.sw:has(:checked) .thumb{box-shadow:0 0 0 2px var(--accent)}
.sw:has(:focus-visible) .thumb{outline:2px solid var(--accent);outline-offset:2px}

/* status bar */
#status{flex:none;height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
#saveState{display:none;flex:none;height:20px;padding:0 6px;margin:0 -10px 0 -6px;border:0;background:none;color:var(--fg);font-size:12px}
#saveState.dirty{display:block}#saveState::before{content:"● ";color:var(--accent)}#saveState:hover{background:var(--hover)}
#path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text;-webkit-user-select:text;cursor:copy}
#path:hover{color:var(--fg)}#path.copied::after{content:" — Copied";color:var(--accent)}
#stats{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* menus and dialogs, macOS-style */
.menu{display:none;position:fixed;min-width:200px;padding:5px;border-radius:9px;background:var(--raised);box-shadow:var(--shadow);z-index:300}
.menu button{display:flex;justify-content:flex-start;gap:10px;width:100%;height:30px;padding:0 10px;border:0;border-radius:6px;background:none}
.menu button:hover,.menu button:focus-visible,.menu button.open{background:var(--hover);outline:0}
.menu .mi{flex:none;width:18px;display:inline-flex;justify-content:center;color:var(--mute);font-size:11px;font-weight:600}
.menu .ml{flex:1;text-align:left}
.menu kbd{padding-left:24px;color:var(--mute);opacity:1}
.menu .mc svg{width:12px;height:12px;color:var(--mute)}
.menu .mc .ck{width:14px;height:14px;color:var(--accent)}
/* Quick Insert palette ("/" on an empty line) */
#slash{width:320px;max-height:min(380px,55vh);overflow:auto}
#slash .mh{padding:8px 10px 4px}
#slash button{height:auto;min-height:44px;padding:5px 8px}
#slash button:hover{background:none}#slash button.sel{background:var(--hover)}
#slash .mi{width:32px;height:32px;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font-size:12px}
#slash .ml small{display:block;margin-top:1px;color:var(--mute);font-size:11px}
#slash .none{padding:10px;color:var(--mute)}
.menu button.danger,.menu button.danger .mi{color:#e5484d}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .mh{padding:4px 10px 2px;font-size:11px;font-weight:600;color:var(--mute)}
dialog{width:min(360px,calc(100vw - 32px));padding:20px;border:0;border-radius:12px;background:var(--raised);color:var(--fg);box-shadow:var(--shadow)}
dialog::backdrop{background:#0000004d}
dialog h3{margin:0 0 6px;font-size:14px;font-weight:600}dialog p{margin:0 0 18px;color:var(--mute);line-height:1.5}
dialog .row{display:flex;gap:8px;justify-content:flex-end}dialog .row button{min-width:84px}
#drop{display:none;position:fixed;inset:8px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);z-index:200;pointer-events:none}
#drop::after{content:"Drop Markdown files to open them";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:8px;background:var(--raised);box-shadow:var(--shadow);font-size:14px}

/* narrower windows: icon-only modes, sidebars float over the document, then tabs get their own row */
@media (max-width:900px){.seg.modes>button span{display:none}.seg.modes>button{padding:0 8px}}
@media (max-width:720px){
  .app{position:relative}
  #side,#settings{position:absolute;top:0;bottom:0;z-index:100;box-shadow:var(--shadow)}
  #side{left:0}#settings{right:0}
}
@media (max-width:560px){
  #bar{height:auto;flex-wrap:wrap;padding-top:6px;row-gap:6px}
  #bar>.actions{margin-left:auto}
  #tabs{order:3;flex-basis:100%;height:40px;margin:0 -8px;padding:0 8px}
  .actions .sep{margin:0 2px}
}
body.ql #side,body.ql #bar,body.ql #status,body.ql #settings,body.ql #find{display:none!important}
@media print{#side,#bar,#tTree,#status,#settings,#find,#editor,#empty,.menu{display:none!important}body,.app{height:auto;overflow:visible;display:block}#out{position:static;overflow:visible;display:block!important;padding:0}
/* the paper sets the width: Page width (760px) is wider than A4 (~658px inside 18mm margins) and cut off the right edge */
#doc{max-width:none!important;margin:0!important;padding:0 1px!important} /* 1px: a full-width table's outer border sits half outside and got clipped */
/* paper can't scroll: code blocks wrap instead of running off the page (tables already wrap, see above) */
.vditor-reset pre>code{white-space:pre-wrap!important;overflow-wrap:anywhere!important;overflow:visible!important}
/* page breaks: headings stay with the text after them; rows, code, images, diagrams and quotes aren't split across pages; table headers repeat */
.vditor-reset :is(h1,h2,h3,h4,h5,h6){break-after:avoid}
.vditor-reset :is(tr,pre,img,svg,blockquote,.language-mermaid,.language-math){break-inside:avoid}
.vditor-reset thead{display:table-header-group}}

<script>
const $ = s => document.querySelector(s);
// The page is the whole app; the host shell (the Tauri app, or the macOS Swift app) only answers `native.postMessage({cmd, ...})`
// for things a web page can't do: files, dialogs, clipboard, printing, windows. Keep it that way for portability.
// Every shell replies with a promise.
const native = window.webkit?.messageHandlers?.native                                 // macOS app (WKWebView)
  || (window.__TAURI__ && {postMessage: msg => window.__TAURI__.core.invoke('native', {msg})}); // Tauri: one `native` command
const OS = /Mac|iPhone|iPad/.test(navigator.platform) ? 'mac' : /Win/.test(navigator.platform) ? 'win' : 'linux';
document.documentElement.dataset.os = OS;
// Shortcuts are written Mac-style (⌥⇧⌘O) everywhere in the page; elsewhere they read Ctrl+Alt+Shift+O.
const keyLabel = k => OS === 'mac' ? k : ['⌘Ctrl', '⌥Alt', '⇧Shift'].filter(m => k.includes(m[0])).map(m => m.slice(1) + '+').join('') + k.replace(/[⌥⇧⌘]/g, '');
const keyText = s => s.replace(/[⌥⇧⌘]+./g, keyLabel);
if (OS !== 'mac') for (const el of document.querySelectorAll('[title],kbd')) el.title ? el.title = keyText(el.title) : el.textContent = keyText(el.textContent);
const QL = window.QL_MODE === true;  // set by the Quick Look extension
const FRESH = window.FRESH === true; // set for windows opened after the first: start with an empty tab
const CDN = 'vditor';                // bundled locally: works offline and in Quick Look
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const DEFAULTS = {size: 16, lh: 1.6, width: 760, 'code-size': 14, tab: 4, margin: 18, autosave: '0', align: 'center', 'code-colors': 'github', font: '-apple-system,system-ui,sans-serif', paper: 'a4'};
const opt = k => store.get('set-' + k) ?? String(DEFAULTS[k] ?? '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
if (!['', 'light', 'dark'].includes(opt('theme'))) store.set('set-theme', ''); // Material / One Dark were removed: back to Auto
const themeName = () => opt('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const dark = () => themeName() !== 'light';
const icon = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const ICON = {x: '<path d="M18 6 6 18M6 6l12 12"/>', plus: '<path d="M12 5v14M5 12h14"/>', chev: '<path d="m9 18 6-6-6-6"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  turn: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M8 16H3v5"/>',
  para: '<path d="M13 4v16M17 4v16M19 4H9.5a4.5 4.5 0 0 0 0 9H13"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
  quote: '<path d="M17 6H3M21 12H8M21 18H8M3 12v6"/>',
  ul: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  ol: '<path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>',
  task: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/>',
  code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  typewriter: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  heading: '<path d="M6 12h12M6 20V4M18 20V4"/>',
  bold: '<path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/>',
  italic: '<path d="M19 4h-9M14 20H5M15 4 9 20"/>',
  strike: '<path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/>',
  marker: '<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',
  sup: '<path d="m4 19 8-8M12 19l-8-8M20 12h-4c0-1.5.44-2 1.5-2.5S20 8.33 20 7c0-.47-.17-.93-.48-1.29a2.1 2.1 0 0 0-2.62-.44c-.42.24-.74.62-.9 1.07"/>',
  sub: '<path d="m4 5 8 8M12 5l-8 8M20 19h-4c0-1.5.44-2 1.5-2.5S20 15.33 20 14c0-.47-.17-.93-.48-1.29a2.1 2.1 0 0 0-2.62-.44c-.42.24-.74.62-.9 1.07"/>',
  sigma: '<path d="M18 7V4H6l6 8-6 8h12v-3"/>',
  mathbox: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M16 8.9V7H8l4 5-4 5h8v-1.9"/>',
  checks: '<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
  codeblock: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m10 9-3 3 3 3M14 15l3-3-3-3"/>',
  clip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  asterisk: '<path d="M12 6v12M17.2 9 6.8 15M6.8 9l10.4 6"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  outline: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M13 8h4M13 12h4M13 16h2"/>', down: '<path d="m6 9 6 6 6-6"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  table: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  divider: '<path d="M3 12h18"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  diagram: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M7 10v4a2 2 0 0 0 2 2h5"/>',
  toc: '<path d="M3 6h18M7 12h14M11 18h10"/>',
  focus: '<circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>'};

// ---- tab state: every open document is a tab {name, path, base, value, dirty, handle} ----
let tabs = [], active = 0, editor = null, editorTab = null, ready = false, mode = 'read';
const T = () => tabs[active];

// CommonMark + GFM (tables, tasks, strike, autolinks), footnotes, [toc], ==mark==, ^sup^, ~sub~,
// $KaTeX$, YAML front matter, raw HTML (sanitized), and ```mermaid / flowchart / markmap (graphviz, echarts, abc, smiles, wavedrom and plantuml engines are left out to keep the app small).
const markdown = () => ({toc: true, footnotes: true, mark: true, sup: true, sub: true, gfmAutoLink: true, sanitize: true,
  codeBlockPreview: true, mathBlockPreview: true, autoSpace: false, fixTermTypo: false, linkBase: T()?.base || ''});
const theme = () => ({current: dark() ? 'dark' : 'light', path: CDN + '/dist/css/content-theme'});
// not `hljs`: highlight.js declares that global, and a clash stops it loading
// code style (Settings › Code): VS Code is dark in both themes, so it keeps VS Code's own syntax colors
if (!['github', 'vscode', 'red'].includes(opt('code-colors'))) store.set('set-code-colors', 'github'); // older presets
const hlOpts = () => ({style: opt('code-colors') === 'vscode' ? 'vs2015' : dark() ? 'github-dark' : 'github', lineNumber: true});
// Vditor loads a code theme once; this swaps the stylesheet when the choice (or light/dark) changes
const applyCodeTheme = () => Vditor.setCodeTheme(hlOpts().style, CDN);

// ---- View mode ----
// Load the content theme's stylesheet before rendering: diagrams measure their labels as they draw, and on WebKit
// measured them without the dark stylesheet, clipping every label in dark mode.
function themeCss(){
  const {current, path} = theme();
  Vditor.setContentTheme(current, path);
  const link = document.getElementById('vditorContentTheme');
  if (!link || link.sheet) return Promise.resolve();
  return new Promise(r => { link.addEventListener('load', r, {once: true}); link.addEventListener('error', r, {once: true}); setTimeout(r, 1500); });
}
async function renderView(){
  document.body.classList.toggle('empty', !QL && !T().value.trim());
  applyCodeTheme();
  await themeCss();
  return new Promise(after => Vditor.preview($('#doc'), T().value, {cdn: CDN, mode: dark() ? 'dark' : 'light', theme: theme(), hljs: hlOpts(), markdown: markdown(), math: {engine: 'KaTeX'}, lang: 'en_US', after}));
}
$('#empty').addEventListener('click', e => {
  const go = e.target.closest('[data-go]')?.dataset.go;
  if (go === 'edit') setMode('edit'); else if (go === 'open') $('#open').click();

  const r = e.currentTarget.getBoundingClientRect(), go = v => () => exportAs(v);
  showMenu(r.right, r.bottom + 6, ['Export', ['HTML…', go('html')], ['PDF…', go('pdf')], ['Markdown…', go('md')],
    '-', 'Copy as', ['Markdown', go('c-md')], ['Rich text', go('c-rich')], ['HTML', go('c-html')], ['Plain text', go('c-text')]],
    {right: true, focus: e.detail === 0}); // opened from the keyboard: focus the first item
  $('#export').setAttribute('aria-expanded', 'true');
};
async function copy({html, text}){
  if (native) return native.postMessage({cmd: 'copy', html: html ?? '', text});
  const items = {'text/plain': new Blob([text], {type: 'text/plain'})};
  if (html) items['text/html'] = new Blob([html], {type: 'text/html'});
  await navigator.clipboard.write([new ClipboardItem(items)]);
}

// ---- live settings ----
for (const k of ['font', 'code-font']) if (store.get('set-' + k) === 'ui-monospace,Menlo,monospace') // pre-Windows mono stack
  store.set('set-' + k, 'ui-monospace,Menlo,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace');
document.querySelectorAll('#settings [data-k]').forEach(el => {
  const k = el.dataset.k, u = el.dataset.u || '', box = el.type === 'checkbox', radio = el.type === 'radio';
  const out = el.type === 'range' && el.closest('.field')?.querySelector('output');
  if (box) el.checked = opt(k) === 'true'; else if (radio) el.checked = el.value === opt(k); else if (opt(k) !== '') el.value = opt(k);
  const apply = rerender => {
    const v = box ? String(el.checked) : el.value;
    store.set('set-' + k, v);
    if (out) out.textContent = v + u;
    if (k === 'theme') document.documentElement.dataset.theme = themeName();
    else if (k === 'css') $('#userCss').textContent = v;
    else if (k === 'align') { document.body.classList.toggle('left', v === 'left'); $('[data-k=width]').disabled = v === 'left'; }
    else if (k === 'code-colors') document.documentElement.dataset.code = v;
    else if (['font', 'size', 'lh', 'width', 'code-font', 'code-size', 'tab'].includes(k)) document.documentElement.style.setProperty('--' + k, v + u);
    // theme, code colors and outline need a re-render. Everything else is CSS and updates instantly.
    if (rerender && ['theme', 'code-colors', 'outline'].includes(k)) setMode(mode);
  };
  el.addEventListener(box || radio || el.tagName === 'SELECT' ? 'change' : 'input', () => apply(true));
  if (!radio || el.checked) apply(false); // a radio group applies once, through its checked option
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!opt('theme')) { document.documentElement.dataset.theme = themeName(); setMode(mode); } });

// ---- shortcuts (⌘ on macOS, Ctrl elsewhere) ----
addEventListener('keydown', e => {
  const mod = OS === 'mac' ? e.metaKey : e.ctrlKey; // Ctrl+F/O/T on a Mac are text-editing keys, leave them alone
  if (slash && !slash.list.length && e.key !== 'Backspace') closeSlash(); // nothing matches: let keys through
  if (slash) {
    const d = {ArrowDown: 1, ArrowUp: -1}[e.key];
    if (d || ['Enter', 'Tab', 'Escape'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); }
    if (d) { slash.i = (slash.i + d + slash.list.length) % slash.list.length; return markSlash(); }
    if (e.key === 'Enter' || e.key === 'Tab') return pickSlash();
    if (e.key === 'Escape') return closeSlash();
  }
  if (e.key === 'Escape') { hideMenu(); panel('#find', false); }
  if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); return switchTo((active + (e.shiftKey ? -1 : 1) + tabs.length) % tabs.length); }
  if (OS !== 'mac' && e.getModifierState('AltGraph')) return; // AltGr arrives as Ctrl+Alt: it's typing @, €, { …, not a shortcut
  if (mode === 'edit' && mod && (e.shiftKey || e.altKey)) {
    const [f, texty] = BLOCK_KEYS[(e.altKey ? '⌥' : '') + (e.shiftKey ? '⇧' : '') + '⌘' + e.code.replace(/^(Key|Digit)/, '')] || [];
    const el = f && activeBlock();
    if (el && (!texty || TEXTY.test(el.tagName))) { e.preventDefault(); e.stopPropagation(); return f(el); }
  }
  if (!mod || e.altKey) return;
  if (e.shiftKey && '[]{}'.includes(e.key)) { e.preventDefault(); return switchTo((active + ('[{'.includes(e.key) ? -1 : 1) + tabs.length) % tabs.length); }
  const k = {s: save, o: () => $('#open').click(), f: () => panel('#find', true), '\\': toggleTree, t: () => newTab(), w: () => closeTab(active), n: () => native?.postMessage({cmd: 'newWindow'}),
    ',': () => panel('#settings'), 1: () => setMode('read'), 2: () => setMode('edit'), 3: toggleSource}[e.key];
  if (k) { e.preventDefault(); k(); }
}, true);
$('#fq').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fnext').click(); });

const WELCOME = keyText(`# Welcome to MarkQuill

You're in **View mode**: select and copy freely, nothing changes.

- **Edit** (⌘2) edits inline like Typora. Type \`/\` on an empty line to insert any block. Paste, drop or attach images and files.
- **Blocks**: click the badge in a block's margin (¶, H1…) to duplicate it, turn it into another kind or delete it; its menu lists the shortcuts. Drag the badge to move the block.
- **Source** (⌘3) switches writing to raw markdown. Pick Standard, Source, Typewriter or Focus mode from the dropdown at the end of the formatting row.
- **Tabs**: ⌘T new tab, ⌘W close, Ctrl+Tab to switch. Double-click a tab to rename the file, drag to reorder, right-click to move it to a new window.
- **Settings** (⌘,) has themes, text and code styles, auto-save and more. Changes apply live.

Math $E = mc^2$, ==highlight==, H~2~O, x^2^, footnotes[^1], and diagrams:

\`\`\`mermaid
graph LR
  Write --> Preview --> Export
\`\`\`

[^1]: Like this one.
`);
// Welcome on the first launch only; after an update, the release notes (START is set by the Tauri host)
const START = QL || FRESH ? '' : window.START ?? (window.__TAURI__ ? '' : 'welcome'); // the Swift app and the browser keep the welcome page
if (START === 'welcome') newTab({name: 'Welcome.md', value: WELCOME, blank: !window.__TAURI__}); // Tauri shows it once: a file opened now goes beside it
else if (START === 'changelog') whatsNew();
else newTab();
async function whatsNew(){
  newTab({name: "What's new.md", value: "# What's new in MarkQuill\n\nLoading the release notes…\n", blank: false});
  const t = T(), v = await native.postMessage({cmd: 'version'}), url = `https://github.com/sarat03/markquill/releases/tag/v${v}`;
  let notes = `See the [release notes](${url}).`;
  try {
    const r = await fetch(`https://api.github.com/repos/sarat03/markquill/releases/tags/v${v}`);
    // only GitHub's generated "What's Changed" list (and its Full Changelog link), not the download table above it
    const changed = r.ok && (await r.json()).body?.split(/^## What's Changed\s*$/m)[1];
    if (changed) notes = changed.trim() + `\n\n[Release page](${url})`;
  } catch {}
  t.value = `# What's new in MarkQuill ${v}\n\n${notes}\n`;
  if (tabs.includes(t)) switchTo(tabs.indexOf(t)); // in front of any restored or opened files
}
if (!QL && store.get('tree') === 'true') toggleTree();
