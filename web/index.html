<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDView</title>
<link rel="stylesheet" href="vditor/dist/index.css">
<script src="vditor/dist/index.min.js"></script>
<style>
/* ---- design tokens: chrome (panel) sits a step away from the document (bg), like a macOS sidebar ---- */
:root{--bg:#fff;--fg:#1f2328;--mute:#6b7079;--line:#e3e4e8;--panel:#f7f7f8;--hover:#ebebee;--raised:#fff;--accent:#0969da;--accent-soft:#0969da1f;
  --shadow:0 10px 30px #0000001f,0 0 0 1px #0000000d;--ui:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --font:-apple-system,system-ui,sans-serif;--size:16px;--width:760px;--lh:1.6;--code-font:ui-monospace,Menlo,monospace;--code-size:14px;--tab:4;
  --gutter:clamp(16px,5vw,40px);accent-color:var(--accent)}
:root[data-theme=dark]{--bg:#1d2125;--fg:#d1d5da;--mute:#8b949e;--line:#30363d;--panel:#171a1d;--hover:#2a2f35;--raised:#353b43;--accent:#4493f8;--accent-soft:#4493f833;--shadow:0 10px 30px #00000073,0 0 0 1px #ffffff14}
:root[data-theme=material]{--bg:#263238;--fg:#eeffff;--mute:#89a2ab;--line:#37474f;--panel:#1e282d;--hover:#30414a;--raised:#3b4c55;--accent:#82aaff;--accent-soft:#82aaff33;--shadow:0 10px 30px #00000073,0 0 0 1px #ffffff14}
:root[data-theme=onedark]{--bg:#282c34;--fg:#abb2bf;--mute:#7f848e;--line:#3a3f4b;--panel:#21252b;--hover:#2f343d;--raised:#3e4451;--accent:#61afef;--accent-soft:#61afef33;--shadow:0 10px 30px #00000073,0 0 0 1px #ffffff14}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[contenteditable]:focus-visible{outline:0} /* the writing surface itself */

/* ---- controls ---- */
button,select,input[type=text],textarea{font:inherit;color:var(--fg)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--raised);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
button:hover{background:var(--hover)}
button.on,button.on:hover{background:var(--accent);border-color:var(--accent);color:#fff}
button.icon{width:30px;height:30px;padding:0;border:0;background:none;color:var(--mute);position:relative}
button.icon:hover,button.icon[aria-expanded=true]{background:var(--hover);color:var(--fg)}
select,input[type=text],textarea{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
select{height:28px;cursor:pointer}
textarea{resize:vertical;font:12px/1.5 var(--code-font)}
input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
kbd{font:inherit;font-size:11px;opacity:.7}
/* segmented control (mode switch, font, paper) */
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--hover)}
.seg>button,.seg>label>span{height:26px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.seg>button:hover,.seg>label>span:hover{background:none;color:var(--fg)}
.seg>button.on,.seg>label>input:checked+span{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px #0000001f,0 0 0 .5px #0000000f}
.seg>label>input:focus-visible+span{outline:2px solid var(--accent)}
.seg.full{display:flex}.seg.full>label{flex:1}.seg.full>label>span{width:100%}
/* toggle switch */
.switch{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:18px;margin:0;border-radius:9px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0000004d;transition:transform .15s}
.switch:checked{background:var(--accent)}.switch:checked::after{transform:translateX(12px)}
/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:4px 0 0;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:.5px solid #0000002e;box-shadow:0 1px 3px #0000004d}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:.5px solid #0000002e;box-shadow:0 1px 3px #0000004d}

/* ---- app layout: [files sidebar] [bar / document / status] [settings panel] ---- */
.app{display:flex;height:100%}
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
.side{flex:none;width:250px;display:none;flex-direction:column;background:var(--panel)}
#side{border-right:1px solid var(--line)}#settings{width:290px;border-left:1px solid var(--line)}
body.tree #side,#settings.open{display:flex}
.side-head{flex:none;height:41px;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;border-bottom:1px solid var(--line)}
.side-head h2{flex:1;margin:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bar: tabs + actions in one row */
#bar{flex:none;height:41px;display:flex;align-items:flex-end;gap:4px;padding:0 8px;background:var(--panel);box-shadow:inset 0 -1px 0 var(--line)}
#bar>.icon,.actions{align-self:center}
.actions{display:flex;align-items:center;gap:2px;flex:none}
.actions .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
#save.dirty::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}

/* tabs: the active tab joins the page below it */
#tabs{flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none;padding-left:4px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 1 190px;min-width:96px;height:32px;margin-bottom:4px;display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;border-radius:7px;color:var(--mute);cursor:default;user-select:none;-webkit-user-select:none;position:relative}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.cur{height:36px;margin-bottom:0;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg);color:var(--fg);font-weight:500}
.tab.over::before{content:"";position:absolute;left:-2px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--accent)}
.tab .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:20px;height:20px;padding:0;border:0;border-radius:4px;background:none;color:var(--mute);visibility:hidden}
.tab .x svg{width:13px;height:13px}
.tab .x:hover{background:var(--line);color:var(--fg)}
.tab:hover .x,.tab.cur .x,.tab.dirty .x{visibility:visible}
.tab.dirty:not(:hover) .x svg{display:none}
.tab.dirty:not(:hover) .x::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.tab input{font:inherit;width:100%;height:22px;padding:0 4px}
#newTab{flex:none;width:28px;height:28px;margin-bottom:6px}

/* document */
.body{flex:1;min-height:0;display:flex}
main{flex:1;min-width:0;position:relative}
#out{position:absolute;inset:0;overflow:auto;padding:48px var(--gutter) 30vh}
#editor{height:100%}
body.read #editor,body.edit #out,body.source #out{display:none}
#doc,.vditor-reset{font-family:var(--font)!important;font-size:var(--size)!important;line-height:var(--lh)!important;color:var(--fg)}
#doc code,#doc pre,.vditor-reset code,.vditor-reset pre,.vditor-sv{font-family:var(--code-font)!important;tab-size:var(--tab)}
#doc pre code,.vditor-reset pre code,.vditor-sv{font-size:var(--code-size)!important}
#doc{max-width:var(--width);margin:0 auto;padding:0}
/* empty document */
#empty{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:60%;text-align:center;color:var(--mute);font-size:14px}
#empty>svg{width:44px;height:44px;stroke-width:1.2;margin-bottom:8px;opacity:.7}
#empty h2{margin:0;font-size:18px;font-weight:600;color:var(--fg)}#empty p{margin:0 0 14px}
#empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
body.empty #empty{display:flex}body.empty #doc{display:none}

/* editor (Vditor), themed through its own variables so it reads as part of the page.
   Edit and Source use the same centered column as View, so switching modes doesn't move the text. */
.vditor{--border-color:var(--line);--second-color:var(--line);--panel-background-color:var(--bg);--panel-shadow:var(--shadow);--toolbar-background-color:var(--bg);--toolbar-icon-color:var(--mute);--toolbar-icon-hover-color:var(--fg);--textarea-background-color:var(--bg);--textarea-text-color:var(--fg);--toolbar-height:30px;--toolbar-divider-margin-top:7px;border:0!important;border-radius:0!important;background:var(--bg)}
.vditor-toolbar{display:flex;flex-wrap:wrap;justify-content:center;padding:5px var(--gutter)!important;border-bottom:1px solid var(--line)!important}
.vditor-toolbar__item .vditor-tooltipped{width:30px;padding:0;border-radius:6px;display:flex;align-items:center;justify-content:center}
.vditor-toolbar__item .vditor-tooltipped:hover{background:var(--hover)}
.vditor-toolbar__divider{margin:7px 6px!important}
body.source .vditor-toolbar{display:none}
.vditor-ir .vditor-reset,.vditor-wysiwyg .vditor-reset{max-width:calc(var(--width) + 2 * var(--gutter));margin:0 auto!important;padding:40px var(--gutter) 30vh!important}
.vditor-sv{max-width:calc(var(--width) + 2 * var(--gutter));margin:0 auto!important;padding:48px var(--gutter) 30vh!important;color:var(--fg)!important;background:var(--bg)!important}
.vditor-outline{background:var(--panel)!important}
/* focus mode: dim every block except the one holding the caret */
body.focus .vditor-reset>*{opacity:.25;transition:opacity .15s}
body.focus .vditor-reset>.md-active{opacity:1}

/* find bar (floats over the top right of the document) */
#find{display:none;position:absolute;top:10px;right:18px;z-index:50;width:min(380px,calc(100% - 24px));padding:8px;border-radius:10px;background:var(--raised);box-shadow:var(--shadow);flex-direction:column;gap:6px}
#find.open{display:flex}
body.edit #find{top:52px} /* below the formatting toolbar */
#find .frow{display:flex;align-items:center;gap:4px}
#find input[type=text]{flex:1;min-width:0;height:28px}
#fcount{flex:none;min-width:0;max-width:110px;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#fcount:empty{display:none}
.tog{flex:none;height:28px;min-width:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--mute);font:600 12px var(--code-font);cursor:pointer}
.tog:hover{background:var(--hover);color:var(--fg)}
.tog:has(:checked){background:var(--accent-soft);color:var(--accent)}
.tog:has(:focus-visible){outline:2px solid var(--accent)}
#find .icon{width:28px;height:28px}
#fall{flex:none}

/* files sidebar */
#tree{flex:1;overflow:auto;padding:6px}
#tree summary,#tree a{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;color:var(--fg);text-decoration:none;white-space:nowrap;cursor:pointer;list-style:none}
#tree summary::-webkit-details-marker{display:none}
#tree summary span,#tree a span{overflow:hidden;text-overflow:ellipsis}
#tree summary{font-weight:500}
#tree summary svg{width:12px;height:12px;color:var(--mute);transition:transform .12s}
#tree details[open]>summary svg{transform:rotate(90deg)}
#tree a svg{color:var(--mute)}
#tree a:hover,#tree summary:hover{background:var(--hover)}
#tree a.cur{background:var(--accent-soft);color:var(--accent)}#tree a.cur svg{color:var(--accent)}
#tree .kids{margin-left:14px;padding-left:4px;border-left:1px solid var(--line)}
#tree .hint{color:var(--mute);padding:10px 8px;margin:0;line-height:1.5}

/* settings panel */
#settings .scroll{flex:1;overflow:auto;padding:4px 16px 24px}
#settings h3{margin:20px 0 10px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.field{display:block;margin-bottom:14px}
.fl{display:flex;justify-content:space-between;margin-bottom:6px}
.fl output{color:var(--mute);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer}
.toggle>span{flex:1}.toggle small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-bottom:16px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mute);cursor:pointer}
.sw:has(:checked){color:var(--fg);font-weight:500}
.thumb{display:block;width:100%;height:46px;border-radius:7px;background:var(--t-bg);box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden}
.thumb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:28%;background:var(--t-panel)}
.thumb::after{content:"";position:absolute;left:38%;right:14%;top:12px;height:4px;border-radius:2px;background:var(--t-fg);box-shadow:0 9px 0 var(--t-mute),0 18px 0 var(--t-accent)}
.thumb.sys{background:linear-gradient(135deg,#fff 50%,#1d2125 50%)}.thumb.sys::before,.thumb.sys::after{display:none}
.sw:has(:checked) .thumb{box-shadow:0 0 0 2px var(--accent)}
.sw:has(:focus-visible) .thumb{outline:2px solid var(--accent);outline-offset:2px}

/* status bar */
#status{flex:none;height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
#saveState{height:20px;padding:0 6px;margin-left:-6px;border:0;background:none;color:inherit;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;cursor:default;display:block}
#saveState.dirty{cursor:pointer;color:var(--fg)}#saveState.dirty::before{content:"● ";color:var(--accent)}
#saveState.dirty:hover{background:var(--hover)}
#stats{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* menus and dialogs, macOS-style */
.menu{display:none;position:fixed;min-width:200px;padding:5px;border-radius:9px;background:var(--raised);box-shadow:var(--shadow);z-index:300}
.menu button{display:flex;justify-content:flex-start;width:100%;height:26px;padding:0 10px;border:0;border-radius:5px;background:none}
.menu button:hover,.menu button:focus-visible{background:var(--accent);color:#fff;outline:0}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .mh{padding:4px 10px 2px;font-size:11px;font-weight:600;color:var(--mute)}
dialog{width:min(360px,calc(100vw - 32px));padding:20px;border:0;border-radius:12px;background:var(--raised);color:var(--fg);box-shadow:var(--shadow)}
dialog::backdrop{background:#0000004d}
dialog h3{margin:0 0 6px;font-size:14px;font-weight:600}dialog p{margin:0 0 18px;color:var(--mute);line-height:1.5}
dialog .row{display:flex;gap:8px;justify-content:flex-end}dialog .row button{min-width:84px}
#drop{display:none;position:fixed;inset:8px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);z-index:200;pointer-events:none}
#drop::after{content:"Drop Markdown files to open them";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:8px;background:var(--raised);box-shadow:var(--shadow);font-size:14px}

/* narrower windows: icon-only modes, sidebars float over the document, then tabs get their own row */
@media (max-width:900px){.seg.modes>button span{display:none}.seg.modes>button{padding:0 8px}}
@media (max-width:720px){
  .app{position:relative}
  #side,#settings{position:absolute;top:0;bottom:0;z-index:100;box-shadow:var(--shadow)}
  #side{left:0}#settings{right:0}
}
@media (max-width:560px){
  #bar{height:auto;flex-wrap:wrap;padding-top:6px;row-gap:6px}
  #bar>.actions{margin-left:auto}
  #tabs{order:3;flex-basis:100%;height:40px;margin:0 -8px;padding:0 8px}
  .actions .sep{margin:0 2px}
}
body.ql #side,body.ql #bar,body.ql #status,body.ql #settings,body.ql #find{display:none!important}
@media print{#side,#bar,#status,#settings,#find,#editor,#empty,.menu{display:none!important}body,.app{height:auto;overflow:visible;display:block}#out{position:static;overflow:visible;display:block!important;padding:0}}
</style>
<style id="userCss"></style>
</head>
<body class="read">
<div class="app">
  <aside id="side" class="side" aria-label="Files">
    <div class="side-head">
      <h2 id="treeTitle">Files</h2>
      <button id="openFolder" class="icon" title="Open folder…" aria-label="Open folder"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6M9 13h6"/></svg></button>
    </div>
    <nav id="tree"></nav>
  </aside>

  <div class="pane">
    <header id="bar">
      <button id="tTree" class="icon" title="Files sidebar (⌘\)" aria-label="Files sidebar" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
      <nav id="tabs" aria-label="Open documents" role="tablist"></nav>
      <div class="actions">
        <div class="seg modes" role="group" aria-label="Mode">
          <button id="mRead" class="on" title="View: read and copy without editing (⌘1)"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>View</span></button>
          <button id="mEdit" title="Edit inline, like a document (⌘2). Type / for blocks."><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Edit</span></button>
          <button id="mSource" title="Raw markdown (⌘3)"><svg class="i" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span>Source</span></button>
        </div>
        <span class="sep"></span>
        <button id="open" class="icon" title="Open… (⌘O)" aria-label="Open file"><svg class="i" viewBox="0 0 24 24"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg></button>
        <button id="save" class="icon" title="Save (⌘S)" aria-label="Save"><svg class="i" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
        <button id="export" class="icon" title="Export or copy" aria-label="Export or copy" aria-haspopup="menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></button>
        <span class="sep"></span>
        <button id="tFind" class="icon" title="Find &amp; replace (⌘F)" aria-label="Find and replace" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button id="gear" class="icon" title="Appearance &amp; settings" aria-label="Settings" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></button>
      </div>
    </header>

    <div class="body">
      <main>
        <div id="out"><article id="doc" class="vditor-reset"></article>
          <div id="empty">
            <svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
            <h2>Nothing here yet</h2>
            <p>Start writing, open a Markdown file, or drop one onto the window.</p>
            <div class="row"><button class="on" data-go="edit">Start writing <kbd>⌘2</kbd></button><button data-go="open">Open file… <kbd>⌘O</kbd></button></div>
          </div>
        </div>
        <div id="editor"></div>
        <div id="find" role="search" aria-label="Find and replace">
          <div class="frow">
            <input type="text" id="fq" placeholder="Find" aria-label="Find">
            <span id="fcount" aria-live="polite"></span>
            <label class="tog" title="Match case"><input type="checkbox" id="fcase" class="vh">Aa</label>

<div class="menu" id="ctx" role="menu"></div>
<dialog id="ask"><form method="dialog"><h3></h3><p></p><div class="row"></div></form></dialog>
<div id="drop"></div>
<input type="file" id="file" accept=".md,.markdown,.txt" hidden>
<script>
const $ = s => document.querySelector(s);
// The page is the whole app; the host shell (MDView.app today) only answers `native.postMessage({cmd, ...})`
// for things a web page can't do: files, dialogs, clipboard, printing, windows. Keep it that way for portability.
const native = window.webkit?.messageHandlers?.native;
const QL = window.QL_MODE === true;  // set by the Quick Look extension
const FRESH = window.FRESH === true; // set for windows opened after the first: start with an empty tab
const CDN = 'vditor';                // bundled locally: works offline and in Quick Look
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const DEFAULTS = {size: 16, lh: 1.6, width: 760, 'code-size': 14, tab: 4, margin: 18, autosave: '0', font: '-apple-system,system-ui,sans-serif', paper: 'a4'};
const opt = k => store.get('set-' + k) ?? String(DEFAULTS[k] ?? '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const themeName = () => opt('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const dark = () => themeName() !== 'light';
const icon = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const ICON = {x: '<path d="M18 6 6 18M6 6l12 12"/>', plus: '<path d="M12 5v14M5 12h14"/>', chev: '<path d="m9 18 6-6-6-6"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>'};

// ---- tab state: every open document is a tab {name, path, base, value, dirty, handle} ----
let tabs = [], active = 0, editor = null, editorTab = null, ready = false, mode = 'read';
const T = () => tabs[active];

// CommonMark + GFM (tables, tasks, strike, autolinks), footnotes, [toc], ==mark==, ^sup^, ~sub~,
// $KaTeX$, YAML front matter, raw HTML (sanitized), and ```mermaid / flowchart / graphviz / echarts / abc / markmap.
const markdown = () => ({toc: true, footnotes: true, mark: true, sup: true, sub: true, gfmAutoLink: true, sanitize: true,
  codeBlockPreview: true, mathBlockPreview: true, autoSpace: false, fixTermTypo: false, linkBase: T()?.base || ''});
const theme = () => ({current: dark() ? 'dark' : 'light', path: CDN + '/dist/css/content-theme'});
const hljs = () => ({style: dark() ? 'native' : 'github', lineNumber: true});

// ---- View mode ----
function renderView(){
  document.body.classList.toggle('empty', !QL && !T().value.trim());
  return new Promise(after => Vditor.preview($('#doc'), T().value, {cdn: CDN, mode: dark() ? 'dark' : 'light', theme: theme(), hljs: hljs(), markdown: markdown(), math: {engine: 'KaTeX'}, lang: 'en_US', after}));
}
$('#empty').addEventListener('click', e => {
  const go = e.target.closest('[data-go]')?.dataset.go;
  if (go === 'edit') setMode('edit'); else if (go === 'open') $('#open').click();
});

// ---- Edit (inline WYSIWYG) and Source (raw markdown) modes ----
const blocks = [ // slash menu for people new to markdown
  ['Heading 1', '# '], ['Heading 2', '## '], ['Heading 3', '### '],
  ['Bullet list', '- '], ['Numbered list', '1. '], ['Checklist', '- [ ] '], ['Quote', '> '],
  ['Callout (note)', '> [!NOTE]\n> '], ['Code block', '```js\n\n```'], ['Table', '| Column | Column |\n| --- | --- |\n|  |  |'],
  ['Math block', '$$\na^2 + b^2 = c^2\n$$'], ['Mermaid diagram', '```mermaid\ngraph LR\n  A --> B\n```'],
  ['Sequence diagram', '```mermaid\nsequenceDiagram\n  Alice->>Bob: Hi\n  Bob-->>Alice: Hello\n```'],
  ['Gantt chart', '```mermaid\ngantt\n  title Plan\n  section Work\n  Task A :a1, 2026-01-01, 7d\n  Task B :after a1, 5d\n```'],
  ['Flowchart.js', '```flowchart\nst=>start: Start\ne=>end: End\nst->e\n```'],
  ['Footnote', 'Text[^1]\n\n[^1]: The footnote.'], ['Table of contents', '[toc]'], ['Front matter', '---\ntitle: \ntags: []\n---\n'],
  ['Highlight', '==highlighted=='], ['Superscript', 'x^2^'], ['Subscript', 'H~2~O'],
  ['Divider', '---'], ['Link', '[text](https://)'], ['Image', '![alt](https://)'],
];
// ponytail: one editor instance re-created per tab switch; per-tab undo history is lost on switch. Keep one Vditor per tab if that matters.
function createEditor(kind){
  if (ready) editor.destroy(); else $('#editor').innerHTML = ''; // Vditor can't destroy mid-init
  ready = false;
  const tab = editorTab = T();
  editor = new Vditor('editor', {
    cdn: CDN, lang: 'en_US', mode: kind, value: tab.value, height: '100%', cache: {enable: false},
    theme: dark() ? 'dark' : 'classic', icon: 'material',
    typewriterMode: opt('typewriter') === 'true',
    outline: {enable: opt('outline') === 'true', position: 'left'},
    placeholder: kind === 'sv' ? '' : 'Type / for blocks, : for emoji, or just start writing…',
    toolbar: kind === 'sv' ? ['undo', 'redo'] :
      ['headings', 'bold', 'italic', 'strike', 'link', '|', 'list', 'ordered-list', 'check', 'quote', 'code', 'inline-code', 'table', 'emoji', 'upload', '|', 'undo', 'redo', '|', 'outline', 'edit-mode'],
    preview: {mode: 'editor', theme: theme(), hljs: hljs(), markdown: markdown(), math: {engine: 'KaTeX'}},
    hint: {emojiPath: CDN + '/dist/images/emoji', extend: [{key: '/', hint: q => blocks
      .filter(([t]) => t.toLowerCase().includes(q.toLowerCase()))
      .map(([t, v]) => ({html: t, value: v}))}]},
    upload: {accept: 'image/*', multiple: true, handler: saveAssets},
    input: v => changed(v, tab),
    after: () => { ready = true; editor.focus(); },
  });
}
// the editor's text back into its tab (the editor only holds the live copy)
function commit(){ if (editorTab && ready) editorTab.value = editor.getValue(); }
const current = () => editorTab === T() && ready ? editor.getValue() : T().value;
function changed(v, t = T()){
  t.value = v;
  if (!t.dirty) { t.dirty = true; syncChrome(); } else if (t === T()) stats();
  scheduleAutosave(t);
}

// ---- Focus mode ----
document.addEventListener('selectionchange', () => {
  if (!document.body.classList.contains('focus')) return;
  const root = ready && editor.vditor[editor.getCurrentMode()]?.element; // the visible pane (Vditor keeps hidden ones)
  let n = getSelection().anchorNode;
  while (n && n.parentNode !== root) n = n.parentNode;
  if (n?.classList?.contains('md-active')) return;
  root?.querySelectorAll(':scope > .md-active').forEach(e => e.classList.remove('md-active'));
  n?.classList?.add('md-active');
});

// ---- Assets: pasted / dropped / uploaded images go next to the document ----
async function saveAssets(files){
  if (!native) return 'Image saving works in the MDView app.';
  const lines = [];
  for (const f of files) {
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(f); });
    const res = await native.postMessage({cmd: 'asset', doc: T().path, name: f.name || 'image.png', data, folder: opt('assets') || 'assets'});
    if (res.error) return res.error;
    lines.push(`![${f.name.replace(/\.\w+$/, '')}](${res.path})`);
  }
  editor.insertValue(lines.join('\n'));
  return null;
}

// ---- modes ----
async function setMode(m){
  if (QL) m = 'read';
  commit();
  mode = m;
  for (const c of ['read', 'edit', 'source']) document.body.classList.toggle(c, c === m);
  document.body.classList.toggle('ql', QL);
  for (const [id, k] of [['#mRead', 'read'], ['#mEdit', 'edit'], ['#mSource', 'source']]) {
    $(id).classList.toggle('on', m === k); $(id).setAttribute('aria-pressed', m === k);
  }
  if (m === 'read') { editorTab = null; await renderView(); } else createEditor(m === 'edit' ? 'ir' : 'sv');
}
$('#mRead').onclick = () => setMode('read');
$('#mEdit').onclick = () => setMode('edit');
$('#mSource').onclick = () => setMode('source');

// ---- tabs ----
function newTab(o = {}){
  tabs.push({name: 'Untitled.md', path: '', base: '', value: '', dirty: false, handle: null, blank: true, ...o});
  switchTo(tabs.length - 1);
}
function switchTo(i){
  commit();
  active = Math.max(0, Math.min(i, tabs.length - 1));
  syncChrome();
  setMode(mode);
}
const pristine = t => t && t.blank && !t.dirty; // an untouched new/welcome tab
// Called by the host (and by drag-and-drop / Open) with a file's contents. Reuses the tab if the file is already open.
function load(name, text, dir = '', path = '', dirty = false){
  const open = path ? tabs.findIndex(t => t.path === path) : -1;
  if (open >= 0) return switchTo(open);
  const t = {name, value: text, base: dir, path, dirty, blank: false};
  if (pristine(T())) { Object.assign(T(), t); editorTab = null; switchTo(active); } // replace an empty/welcome tab
  else newTab(t);
}
async function closeTab(i){
  const t = tabs[i]; if (!t) return false;
  if (t === editorTab) commit();
  if (t.dirty) {
    if (i !== active) switchTo(i);
    const r = await ask(`Save changes to ${t.name}?`, "Your changes will be lost if you don't save them.", ['Save', "Don't Save", 'Cancel']);
    if (r === 2 || (r === 0 && !(await saveTab(t)))) return false;
  }
  removeTab(t);
  return true;
}
function removeTab(t){
  const i = tabs.indexOf(t); if (i < 0) return;
  if (t === editorTab) editorTab = null;
  const cur = T();
  tabs.splice(i, 1);
  if (!tabs.length) return native ? native.postMessage({cmd: 'closeWindow'}) : newTab();
  if (cur === t) switchTo(Math.min(i, tabs.length - 1));
  else { active = tabs.indexOf(cur); syncChrome(); }
}
function moveToWindow(t){
  if (t === editorTab) commit();
  native.postMessage({cmd: 'newWindow', name: t.name, text: t.value, path: t.path, base: t.base, dirty: t.dirty});
  removeTab(t);
}
function renameTab(t){
  const el = $(`#tabs .tab[data-i="${tabs.indexOf(t)}"] .tn`); if (!el) return;
  const input = document.createElement('input');
  input.value = t.name; input.setAttribute('aria-label', 'File name');
  el.replaceWith(input);
  input.focus(); input.setSelectionRange(0, t.name.replace(/\.\w+$/, '').length);
  let done = false;
  const finish = async ok => {
    if (done) return; done = true;
    let name = input.value.trim();
    if (ok && name && name !== t.name) {
      if (/[\/\\:]/.test(name) || name.startsWith('.')) await ask('Invalid name', 'File names can’t start with a dot or contain / \\ or :', ['OK']);
      else {
        if (!/\.\w+$/.test(name)) name += '.md';
        if (t.path && native) { // renames the file on disk
          const r = await native.postMessage({cmd: 'rename', path: t.path, name});
          if (r.error) await ask('Couldn’t rename', r.error, ['OK']); else Object.assign(t, r);
        } else t.name = name;    // not saved yet: just the name it will be saved as
      }
    }
    syncChrome(); refreshTreeIfOpen();
  };
  input.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  input.onblur = () => finish(true);
}
function renderTabs(){
  $('#tabs').innerHTML = tabs.map((t, i) =>
    `<div class="tab${i === active ? ' cur' : ''}${t.dirty ? ' dirty' : ''}" draggable="true" data-i="${i}" title="${esc(t.path || t.name)}" role="tab" aria-selected="${i === active}">` +
    `<span class="tn">${esc(t.name)}</span><button class="x" data-close="${i}" aria-label="Close ${esc(t.name)}">${icon(ICON.x)}</button></div>`).join('') +
    `<button id="newTab" class="icon" title="New tab (⌘T)" aria-label="New tab">${icon(ICON.plus)}</button>`;
  $('#tabs .cur')?.scrollIntoView({block: 'nearest', inline: 'nearest'});
}
// title bar, dirty dot, session restore: the host keeps what it needs from this one message
function syncChrome(){
  renderTabs(); stats(); saveState(); markTree();
  if (native && !QL) native.postMessage({cmd: 'state', title: T().name, path: T().path, dirty: tabs.some(t => t.dirty), paths: tabs.map(t => t.path).filter(Boolean)});
}
const tabsEl = $('#tabs');
tabsEl.addEventListener('click', e => {
  if (e.target.closest('#newTab')) return newTab();
  const x = e.target.closest('[data-close]'); if (x) return closeTab(+x.dataset.close);
  const el = e.target.closest('.tab');
  if (el && +el.dataset.i !== active && !e.target.closest('input')) switchTo(+el.dataset.i);
});
tabsEl.addEventListener('auxclick', e => { const el = e.target.closest('.tab'); if (el && e.button === 1) closeTab(+el.dataset.i); });
tabsEl.addEventListener('dblclick', e => {
  const el = e.target.closest('.tab');
  if (el && !e.target.closest('button,input')) renameTab(tabs[+el.dataset.i]);
  else if (e.target === tabsEl) newTab();
});
tabsEl.addEventListener('contextmenu', e => {
  const el = e.target.closest('.tab'); if (!el) return;
  e.preventDefault();
  const t = tabs[+el.dataset.i];
  showMenu(e.clientX, e.clientY, [
    ['Rename…', () => renameTab(t)],
    native && ['Move to New Window', () => moveToWindow(t)],
    '-',
    ['Close', () => closeTab(tabs.indexOf(t))],
    ['Close Others', async () => { for (const o of tabs.filter(o => o !== t)) if (!(await closeTab(tabs.indexOf(o)))) break; }],
  ]);
});
// drag to reorder; drag a tab out of the window to move it to a new window
let dragFrom = -1;
tabsEl.addEventListener('dragstart', e => { const el = e.target.closest('.tab'); if (!el) return; dragFrom = +el.dataset.i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', tabs[dragFrom].name); });
tabsEl.addEventListener('dragover', e => {
  if (dragFrom < 0) return; e.preventDefault();
  tabsEl.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  e.target.closest('.tab')?.classList.add('over');
});
tabsEl.addEventListener('drop', e => {
  const el = e.target.closest('.tab'); if (dragFrom < 0 || !el) return;
  e.preventDefault();
  const cur = T(), [t] = tabs.splice(dragFrom, 1);
  tabs.splice(+el.dataset.i, 0, t);
  active = tabs.indexOf(cur); dragFrom = -1; syncChrome();
});
tabsEl.addEventListener('dragend', e => {
  tabsEl.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  const outside = e.clientX < 0 || e.clientY < 0 || e.clientX > innerWidth || e.clientY > innerHeight;
  if (dragFrom >= 0 && native && outside && e.dataTransfer.dropEffect === 'none') moveToWindow(tabs[dragFrom]);
  dragFrom = -1;
});

// ---- menus: items are [label, action], '-' for a separator, or a plain string for a section heading ----
function showMenu(x, y, items, {right = false, focus = false} = {}){
  const m = $('#ctx'); m.innerHTML = '';
  for (const it of items.filter(Boolean)) {
    if (typeof it === 'string') {
      const el = document.createElement(it === '-' ? 'hr' : 'div');
      if (it !== '-') { el.className = 'mh'; el.textContent = it; }
      m.append(el); continue;
    }
    const b = document.createElement('button'); b.textContent = it[0]; b.setAttribute('role', 'menuitem');
    b.onclick = () => { hideMenu(); it[1](); };
    m.append(b);
  }
  m.style.display = 'block';
  const w = m.offsetWidth, h = m.offsetHeight;
  Object.assign(m.style, {left: Math.max(8, Math.min(right ? x - w : x, innerWidth - w - 8)) + 'px', top: Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px'});
  if (focus) m.querySelector('button')?.focus();
}
function hideMenu(){ $('#ctx').style.display = 'none'; $('#export').setAttribute('aria-expanded', 'false'); }
$('#ctx').addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const bs = [...$('#ctx').querySelectorAll('button')], i = bs.indexOf(document.activeElement);
  bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length]?.focus();
});
addEventListener('mousedown', e => { if (!e.target.closest('#ctx, #export')) hideMenu(); });

// in-page dialog (same look on every platform); resolves to the clicked button's index, Esc = last button
function ask(title, msg, buttons){
  const d = $('#ask');
  d.querySelector('h3').textContent = title; d.querySelector('p').textContent = msg;
  d.querySelector('.row').innerHTML = buttons.map((b, i) => `<button value="${i}"${i === 0 ? ' class="on" autofocus' : ''}>${esc(b)}</button>`).join('');
  d.showModal();
  return new Promise(r => { // answer on click / Esc directly rather than waiting for the dialog's close event
    d.querySelectorAll('.row button').forEach((btn, i) => btn.onclick = () => r(i));
    d.oncancel = () => r(buttons.length - 1);
  });
}

// ---- status bar: save state on the left, word counter on the right ----
function stats(){
  const v = T().value, t = v.replace(/```[\s\S]*?```/g, ' ');
  const words = (t.match(/[\p{L}\p{N}'’-]+/gu) || []).length;
  const paras = v.split(/\n\s*\n/).filter(s => s.trim()).length;
  $('#stats').textContent = `${words.toLocaleString()} words · ${v.length.toLocaleString()} characters · ${paras} paragraphs`;
}
function saveState(){
  const t = T(), el = $('#saveState');
  el.classList.toggle('dirty', t.dirty);
  el.textContent = t.dirty ? 'Unsaved changes' : t.path;
  el.title = t.dirty ? 'Save (⌘S)' : t.path;
  $('#save').classList.toggle('dirty', t.dirty);
}
$('#saveState').onclick = () => T().dirty && save();

// ---- open / save ----
$('#open').onclick = async () => {
  if (native) return native.postMessage({cmd: 'open'});
  if (window.showOpenFilePicker) {
    try { const [h] = await showOpenFilePicker({types: [{accept: {'text/markdown': ['.md', '.markdown']}}]}); const f = await h.getFile(); load(f.name, await f.text()); T().handle = h; } catch {}
  } else $('#file').click();
};
$('#file').onchange = async e => { const f = e.target.files[0]; if (f) load(f.name, await f.text()); };
function download(name, data, type){
  if (native) return native.postMessage({cmd: 'export', name, data});
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type})); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
async function saveTab(t = T()){
  if (t === editorTab) commit();
  if (native) {
    const r = await native.postMessage({cmd: 'save', path: t.path, name: t.name, data: t.value});
    if (!r) return false;                                           // cancelled or failed
    if (r.path) { Object.assign(t, r); if (t === T()) setMode(mode); } // Save As: new path, re-resolve images
  } else if (t.handle?.createWritable) { const w = await t.handle.createWritable(); await w.write(t.value); await w.close(); }
  else download(t.name, t.value, 'text/markdown');
  t.dirty = false; syncChrome(); refreshTreeIfOpen();
  return true;
}
const save = () => saveTab();
// used by the host before closing a window / quitting
async function saveAll(){ for (const t of tabs.filter(t => t.dirty)) if (!(await saveTab(t))) return false; return true; }
$('#save').onclick = save;
let autoTimer;
function scheduleAutosave(t){ // only files that already exist on disk; never pops a save dialog
  clearTimeout(autoTimer);
  const s = +opt('autosave');
  if (s && native && t.path) autoTimer = setTimeout(() => t.dirty && tabs.includes(t) && saveTab(t), s * 1000);
}
const isDoc = f => /\.(md|markdown|mdown|txt)$/i.test(f?.name || '');
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragover', e => { e.preventDefault(); if (mode === 'read' && hasFiles(e)) $('#drop').style.display = 'block'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('#drop').style.display = 'none'; });
addEventListener('drop', async e => {
  $('#drop').style.display = 'none';
  const docs = [...(e.dataTransfer?.files || [])].filter(isDoc);
  if (!docs.length) { if (mode === 'read' && hasFiles(e)) e.preventDefault(); return; } // images dropped while editing go to the editor
  e.preventDefault(); e.stopPropagation();
  for (const f of docs) load(f.name, await f.text()); // each dropped file opens in its own tab
}, true);

// ---- files sidebar (folder of the current document, or one picked with Open Folder) ----
async function refreshTree(){
  const el = $('#tree');
  $('#openFolder').hidden = !native;
  if (!native) { el.innerHTML = '<p class="hint">The files sidebar works in the MDView app.</p>'; return; }
  const t = await native.postMessage({cmd: 'tree', doc: T().path});
  const cur = T().path;
  const node = n => n.children
    ? `<details${cur.startsWith(n.path + '/') ? ' open' : ''}><summary>${icon(ICON.chev)}<span>${esc(n.name)}</span></summary><div class="kids">${n.children.map(node).join('')}</div></details>`
    : `<a data-path="${esc(n.path)}" title="${esc(n.path)}">${icon(ICON.file)}<span>${esc(n.name)}</span></a>`;
  $('#treeTitle').textContent = t ? t.name : 'Files';
  el.innerHTML = !t ? '<p class="hint">Open a file or folder to browse it here.</p>'
    : t.children.length ? t.children.map(node).join('') : '<p class="hint">No Markdown files in this folder.</p>';
  markTree();
}
$('#openFolder').onclick = async () => { await native.postMessage({cmd: 'openFolder'}); refreshTree(); };
const refreshTreeIfOpen = () => document.body.classList.contains('tree') && refreshTree();
function markTree(){ document.querySelectorAll('#tree a').forEach(a => a.classList.toggle('cur', a.dataset.path === T()?.path)); }
$('#tree').addEventListener('click', e => {
  const a = e.target.closest('a[data-path]');
  if (a) native.postMessage({cmd: 'openPath', path: a.dataset.path}); // opens in a new tab, or switches to it
});
function toggleTree(){
  const on = document.body.classList.toggle('tree');
  store.set('tree', on); $('#tTree').setAttribute('aria-expanded', on);
  if (on) refreshTree();
}
$('#tTree').onclick = toggleTree;

// ---- panels: find bar and settings ----
function panel(id, open){
  const el = $(id), btn = $(id === '#find' ? '#tFind' : '#gear');
  open ??= !el.classList.contains('open');
  el.classList.toggle('open', open); btn.setAttribute('aria-expanded', open);
  if (open && id === '#find') { $('#fq').focus(); $('#fq').select(); countMatches(); }
}
$('#tFind').onclick = () => panel('#find');
$('#fclose').onclick = () => panel('#find', false);
$('#gear').onclick = () => panel('#settings');
$('#closeSettings').onclick = () => panel('#settings', false);

// ---- find & replace (current document) ----
function pattern(){
  const q = $('#fq').value; if (!q) return null;
  try { return new RegExp($('#fre').checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), $('#fcase').checked ? 'g' : 'gi'); }
  catch { $('#fcount').textContent = 'Invalid regex'; return null; }
}
function countMatches(){
  $('#fcount').textContent = '';
  const p = pattern(); if (!p) return;
  const n = (current().match(p) || []).length;
  $('#fcount').textContent = n ? `${n} match${n === 1 ? '' : 'es'}` : 'No results';
}
['fq', 'fre', 'fcase'].forEach(id => $('#' + id).addEventListener('input', countMatches));
$('#fnext').onclick = () => { // highlights the next visible occurrence; regex patterns use the first literal match
  const p = pattern(); if (!p) return;
  const m = current().match(p); if (m) window.find(m[0], $('#fcase').checked, false, true);
};
$('#fall').onclick = () => {
  const p = pattern(); if (!p) return;
  const t = T(), v = current(), n = (v.match(p) || []).length;
  if (!n) return;
  changed(v.replace(p, $('#fr').value), t);
  if (mode === 'read') renderView(); else editor.setValue(t.value);
  $('#fcount').textContent = `Replaced ${n}`;
};

// ---- export & copy (renders the View first so diagrams/math are included) ----
async function exportAs(v){
  commit();
  const t = T(), name = t.name.replace(/\.\w+$/, '');
  if (v === 'md') return download(name + '.md', t.value, 'text/markdown');
  if (v === 'c-md') return copy({text: t.value});
  if (mode !== 'read') await setMode('read');
  const html = $('#doc').innerHTML;
  if (v === 'pdf') native ? native.postMessage({cmd: 'print', paper: opt('paper') || 'a4', margin: opt('margin'), numbers: opt('pagenums')}) : print();
  if (v === 'html') {
    let css = '';
    for (const s of document.styleSheets) try { css += [...s.cssRules].map(r => r.cssText).join('\n'); } catch {}
    download(name + '.html', `<!doctype html><html data-theme="${themeName()}"><meta charset="utf-8"><title>${esc(name)}</title><style>${css}</style><body style="height:auto;display:block;overflow:auto;padding:48px 16px"><article id="doc" class="vditor-reset" style="${document.documentElement.style.cssText}">${html}</article>`, 'text/html');
  }
  if (v === 'c-html') copy({text: html});
  if (v === 'c-text') copy({text: $('#doc').innerText});
  if (v === 'c-rich') copy({html, text: $('#doc').innerText});
}
$('#export').onclick = e => {
  if ($('#export').getAttribute('aria-expanded') === 'true') return hideMenu();
  const r = e.currentTarget.getBoundingClientRect(), go = v => () => exportAs(v);
  showMenu(r.right, r.bottom + 6, ['Export', ['HTML…', go('html')], ['PDF…', go('pdf')], ['Markdown…', go('md')],
    '-', 'Copy as', ['Markdown', go('c-md')], ['Rich text', go('c-rich')], ['HTML', go('c-html')], ['Plain text', go('c-text')]],
    {right: true, focus: e.detail === 0}); // opened from the keyboard: focus the first item
  $('#export').setAttribute('aria-expanded', 'true');
};
async function copy({html, text}){
  if (native) return native.postMessage({cmd: 'copy', html: html ?? '', text});
  const items = {'text/plain': new Blob([text], {type: 'text/plain'})};
  if (html) items['text/html'] = new Blob([html], {type: 'text/html'});
  await navigator.clipboard.write([new ClipboardItem(items)]);
}

// ---- live settings ----
document.querySelectorAll('#settings [data-k]').forEach(el => {
  const k = el.dataset.k, u = el.dataset.u || '', box = el.type === 'checkbox', radio = el.type === 'radio';
  const out = el.type === 'range' && el.closest('.field')?.querySelector('output');
  if (box) el.checked = opt(k) === 'true'; else if (radio) el.checked = el.value === opt(k); else if (opt(k) !== '') el.value = opt(k);
  const apply = rerender => {
    const v = box ? String(el.checked) : el.value;
    store.set('set-' + k, v);
    if (out) out.textContent = v + u;
    if (k === 'theme') document.documentElement.dataset.theme = themeName();
    else if (k === 'css') $('#userCss').textContent = v;
    else if (k === 'focus') document.body.classList.toggle('focus', el.checked);
    else if (['font', 'size', 'lh', 'width', 'code-font', 'code-size', 'tab'].includes(k)) document.documentElement.style.setProperty('--' + k, v + u);
    // theme, typewriter and outline are editor options: rebuild. Everything else is CSS and updates instantly.
    if (rerender && ['theme', 'typewriter', 'outline'].includes(k)) setMode(mode);
  };
  el.addEventListener(box || radio || el.tagName === 'SELECT' ? 'change' : 'input', () => apply(true));
  if (!radio || el.checked) apply(false); // a radio group applies once, through its checked option
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!opt('theme')) { document.documentElement.dataset.theme = themeName(); setMode(mode); } });

// ---- shortcuts (⌘ on macOS, Ctrl elsewhere) ----
addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideMenu(); panel('#find', false); }
  if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); return switchTo((active + (e.shiftKey ? -1 : 1) + tabs.length) % tabs.length); }
  if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
  if (e.shiftKey && '[]{}'.includes(e.key)) { e.preventDefault(); return switchTo((active + ('[{'.includes(e.key) ? -1 : 1) + tabs.length) % tabs.length); }
  const k = {s: save, o: () => $('#open').click(), f: () => panel('#find', true), '\\': toggleTree, t: () => newTab(), w: () => closeTab(active),
    ',': () => panel('#settings'), 1: () => setMode('read'), 2: () => setMode('edit'), 3: () => setMode('source')}[e.key];
  if (k) { e.preventDefault(); k(); }
}, true);
$('#fq').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fnext').click(); });

const WELCOME = `# Welcome to MDView

You're in **View mode**: select and copy freely, nothing changes.

- **Edit** (⌘2) edits inline like Typora. Type \`/\` for blocks and \`:\` for emoji.
- **Source** (⌘3) shows the raw markdown.
- **Tabs**: ⌘T new tab, ⌘W close, Ctrl+Tab to switch. Double-click a tab to rename the file, drag to reorder, right-click to move it to a new window.
- **Settings** (⌘,) has themes, typewriter mode, focus mode, auto-save and more. Changes apply live.

Math $E = mc^2$, ==highlight==, H~2~O, x^2^, footnotes[^1], and diagrams:

\`\`\`mermaid
graph LR
  Write --> Preview --> Export
\`\`\`

[^1]: Like this one.
`;
newTab(QL || FRESH ? {} : {name: 'Welcome.md', value: WELCOME});
if (!QL && store.get('tree') === 'true') toggleTree();
</script>
</body>
